name: Firmware build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build PlatformIO container
        run: docker build --tag hp-remote-builder --file Containerfile .
      - name: Build firmware
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace
          hp-remote-builder run -e xiao_esp32s3
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hp-remote-${{ github.sha }}
          path: .pio/build/xiao_esp32s3/artifacts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: hp-remote-${{ github.sha }}
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.bin --generate-notes